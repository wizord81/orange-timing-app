<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Accueil - Gestion conseillers & clients</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .version { font-style: italic; position: absolute; top: 5px; left: 10px; }
    .clients-container { position: absolute; top: 50px; right: 20px; width: 300px; border: 2px solid #000; padding: 10px; border-radius: 8px; background: #f9f9f9; }
    .client-entry { display: flex; justify-content: space-between; align-items: center; padding: 5px; margin-bottom: 5px; border-bottom: 1px solid #ccc; }
    .client-entry span { font-weight: bold; }
    .delete-btn { color: red; cursor: pointer; font-weight: bold; }
    .orange { color: orange; }
    .red { color: red; }
  </style>
</head>
<body>
  <div class="version">v1.010</div>
  <h1>Poste Accueil</h1>

  <h2>Ajouter un client</h2>
  <form id="clientForm">
    <input type="text" id="clientName" placeholder="Nom du client" required>
    <br><br>
    <textarea id="clientReason" placeholder="Objet de la visite"></textarea>
    <br><br>
    <button type="submit">Ajouter</button>
  </form>

  <div class="clients-container">
    <h3>Liste des clients en attente</h3>
    <div id="clientList"></div>
  </div>

  <script>
    const socket = io();
    const clientForm = document.getElementById('clientForm');
    const clientList = document.getElementById('clientList');

    clientForm.addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('clientName').value.trim();
      const reason = document.getElementById('clientReason').value.trim();
      if (!name) return;
      const client = { id: Date.now(), name, reason, timestamp: Date.now() };
      socket.emit('addClient', client);
      document.getElementById('clientName').value = '';
      document.getElementById('clientReason').value = '';
    });

    socket.on('updateClients', serverClients => {
      clientList.innerHTML = '';
      serverClients.forEach(c => {
        const elapsed = Math.floor((Date.now() - c.timestamp) / 60000);
        let colorClass = '';
        if (elapsed >= 10) colorClass = 'red';
        else if (elapsed >= 0) colorClass = 'orange';
        const div = document.createElement('div');
        div.className = 'client-entry';
        div.innerHTML = `<span>${c.name}</span> <span class="${colorClass}">${elapsed} min</span> <span class="delete-btn" onclick="removeClient(${c.id})">✖</span>`;
        clientList.appendChild(div);
      });
    });

    function removeClient(id) {
      socket.emit('removeClient', id);
    }
  </script>
</body>
</html>
