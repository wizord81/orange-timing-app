<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Conseiller</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .version { font-style: italic; position: absolute; top: 5px; left: 10px; }
    .clients-container { margin-top: 50px; border: 2px solid #000; padding: 10px; border-radius: 8px; background: #f9f9f9; width: 300px; }
    .client-entry { padding: 5px; border-bottom: 1px solid #ccc; }
  </style>
</head>
<body>
  <div class="version">v1.010</div>
  <h1>Poste Conseiller</h1>

  <div class="clients-container">
    <h3>Clients en attente</h3>
    <div id="clientList"></div>
  </div>

  <script>
    const socket = io();
    const clientList = document.getElementById('clientList');

    socket.on('updateClients', clients => {
      clientList.innerHTML = '';
      clients.forEach(c => {
        const div = document.createElement('div');
        div.className = 'client-entry';
        div.textContent = c.name;
        clientList.appendChild(div);
      });
    });
  </script>
</body>
</html>
