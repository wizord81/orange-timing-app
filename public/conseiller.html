<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conseiller — Temps d'occupation</title>
<style>
  :root {
    --orange: #ff7900;
    --texte: #1a1a1a;
    --gris: #f4f4f4;
    --bord: #dcdcdc;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 20px;
    color: var(--texte);
    background: #fff;
    max-width: 640px;
    margin-inline: auto;
  }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  header img { height: 42px; }
  h1 { font-size: 22px; margin: 0; }
  .statut { font-size: 13px; color: #777; margin-bottom: 18px; }
  .statut .pastille {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: #c62828; margin-right: 6px; vertical-align: middle;
  }
  .statut.ok .pastille { background: #2e7d32; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  input[type=text] {
    width: 100%; padding: 12px; font-size: 16px;
    border: 1px solid var(--bord); border-radius: 8px; margin-bottom: 20px;
  }
  .grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .btn {
    padding: 18px 10px; font-size: 17px; font-weight: 600;
    border: none; border-radius: 10px; cursor: pointer; color: #fff;
    transition: transform .08s ease, opacity .15s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn:hover { opacity: .9; }
  .btn.vert { background: #2e7d32; }
  .btn.orange { background: #ef6c00; }
  .btn.rouge { background: #c62828; }
  .btn.dispo { background: #0066cc; grid-column: 1 / -1; }
  .encart {
    margin-top: 22px; padding: 16px; border-radius: 10px;
    background: var(--gris); border: 1px solid var(--bord); display: none;
  }
  .encart.visible { display: block; }
  .encart .titre { font-size: 13px; color: #666; }
  .encart .valeur { font-size: 28px; font-weight: 700; margin-top: 4px; }
  .alerte {
    position: fixed; inset: 0; background: rgba(255,121,0,.96); color: #fff;
    display: none; align-items: center; justify-content: center;
    flex-direction: column; text-align: center; padding: 30px; z-index: 50;
  }
  .alerte.visible { display: flex; animation: pulse 1s ease-in-out infinite alternate; }
  .alerte p { font-size: 26px; font-weight: 700; max-width: 420px; line-height: 1.3; }
  .alerte button {
    margin-top: 24px; padding: 14px 28px; font-size: 17px; font-weight: 600;
    border: none; border-radius: 10px; background: #fff; color: var(--orange); cursor: pointer;
  }
  @keyframes pulse { from { background: rgba(255,121,0,.96); } to { background: rgba(214,96,0,.96); } }
</style>
</head>
<body>

<header>
  <img src="orange-logo.png" alt="Orange" onerror="this.style.display='none'">
  <h1>Mon temps d'occupation</h1>
</header>
<div class="statut" id="statut"><span class="pastille"></span><span id="statutTexte">Connexion…</span></div>

<label for="nom">Votre prénom</label>
<input type="text" id="nom" placeholder="Ex. Julien" autocomplete="given-name">

<div class="grille">
  <button class="btn vert"    onclick="envoyer('2 min')">2 minutes</button>
  <button class="btn vert"    onclick="envoyer('5 min')">5 minutes</button>
  <button class="btn orange"  onclick="envoyer('10 min')">10 minutes</button>
  <button class="btn orange"  onclick="envoyer('20 min')">20 minutes</button>
  <button class="btn rouge"   onclick="envoyer('30 min')">30 minutes</button>
  <button class="btn rouge"   onclick="envoyer('45 min')">45 minutes</button>
  <button class="btn dispo"   onclick="envoyer('Disponible')">Je suis disponible</button>
</div>

<div class="encart" id="encart">
  <div class="titre" id="encartTitre">Dernière réponse envoyée</div>
  <div class="valeur" id="encartValeur">—</div>
</div>

<div class="alerte" id="alerte">
  <p>L'accueil demande votre timing</p>
  <button onclick="fermerAlerte()">J'ai vu</button>
</div>

<audio id="son" src="alert.mp3" preload="auto"></audio>
<script src="/socket.io/socket.io.js"></script>
<script>
  const DUREES = { '2 min':120, '5 min':300, '10 min':600, '20 min':1200, '30 min':1800, '45 min':2700 };

  // Identifiant stable : survit aux rafraîchissements de page
  let clientId = localStorage.getItem('cyf_clientId');
  if (!clientId) {
    clientId = 'c_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem('cyf_clientId', clientId);
  }

  const champNom = document.getElementById('nom');
  champNom.value = localStorage.getItem('cyf_nom') || '';

  const socket = io();
  let finLe = null;

  function nom() {
    return champNom.value.trim() || 'Anonyme';
  }

  function enregistrer() {
    localStorage.setItem('cyf_nom', champNom.value.trim());
    socket.emit('register', { role: 'conseiller', name: nom(), clientId });
  }

  socket.on('connect', () => {
    enregistrer();
    majStatut(true);
  });
  socket.on('disconnect', () => majStatut(false));
  champNom.addEventListener('change', enregistrer);

  function majStatut(connecte) {
    document.getElementById('statut').classList.toggle('ok', connecte);
    document.getElementById('statutTexte').textContent =
      connecte ? 'Connecté à l\'accueil' : 'Hors ligne — reconnexion en cours…';
  }

  function envoyer(timing) {
    socket.emit('register', { role: 'conseiller', name: nom(), clientId });
    socket.emit('response', { clientId, name: nom(), timing });
    localStorage.setItem('cyf_nom', champNom.value.trim());
    finLe = timing === 'Disponible' ? null : Date.now() + DUREES[timing] * 1000;
    document.getElementById('encart').classList.add('visible');
    document.getElementById('encartTitre').textContent =
      timing === 'Disponible' ? 'Vous êtes signalé comme' : 'Temps restant annoncé';
    afficherEncart(timing);
    fermerAlerte();
    debloquerSon();
  }

  function afficherEncart(timing) {
    const valeur = document.getElementById('encartValeur');
    if (!finLe) { valeur.textContent = timing || 'Disponible'; return; }
    const reste = Math.max(0, Math.round((finLe - Date.now()) / 1000));
    if (reste === 0) { valeur.textContent = 'Terminé'; return; }
    const m = String(Math.floor(reste / 60)).padStart(2, '0');
    const s = String(reste % 60).padStart(2, '0');
    valeur.textContent = m + ':' + s;
  }
  setInterval(() => { if (finLe) afficherEncart(); }, 1000);

  // --- Alerte de l'accueil ---
  socket.on('askTiming', () => {
    document.getElementById('alerte').classList.add('visible');
    jouerSon();
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    notifier();
  });

  function fermerAlerte() {
    document.getElementById('alerte').classList.remove('visible');
  }

  // Les navigateurs bloquent le son tant que l'utilisateur n'a pas interagi :
  // on « débloque » l'audio au premier clic sur la page.
  let sonDebloque = false;
  function debloquerSon() {
    if (sonDebloque) return;
    const a = document.getElementById('son');
    a.play().then(() => { a.pause(); a.currentTime = 0; sonDebloque = true; }).catch(() => {});
    sonDebloque = true;
  }
  document.addEventListener('click', debloquerSon, { once: true });

  function jouerSon() {
    const a = document.getElementById('son');
    a.currentTime = 0;
    a.play().catch(() => bip());
  }

  // Bip de secours si alert.mp3 est absent ou bloqué
  function bip() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.25, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
      osc.start(); osc.stop(ctx.currentTime + 0.6);
    } catch (e) {}
  }

  function notifier() {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'granted') {
      new Notification("Demande de l'agent d'accueil", {
        body: 'Merci d\'indiquer votre timing.',
        icon: 'orange-logo.png'
      });
    } else if (Notification.permission !== 'denied') {
      Notification.requestPermission().then(p => { if (p === 'granted') notifier(); });
    }
  }
  if ('Notification' in window && Notification.permission === 'default') {
    document.addEventListener('click', () => Notification.requestPermission(), { once: true });
  }
</script>
</body>
</html>
